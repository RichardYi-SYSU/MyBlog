<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./favicon.ico">
    <title>随笔 - RichardYi's Blog</title>
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/article.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
    rel="stylesheet"/>
    
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="wrapperHeader">
        <div class="header">
            <div class="navBar">
                <img src="./images/avatar/Richard-Yi LOGO.jpg" alt="">
                <ul>
                    <li ><a href="./index.html">首页</a></li>
                    <li><a href="./artworks.html">作品</a></li>
                    <li class="navBarActive"><a href="javascript:;">随笔</a></li>
                    <li><a href="./about.html">关于我</a></li>
                </ul>
            </div>
            
        </div>
    </div>
    <script>
        const img=document.querySelector('.navBar img')
                img.addEventListener('click',()=>{
                    window.open("./index.html","_self")
                    
                })
    </script>

    <!-- banner区域 -->
    <div class="bannerTop  bg_metro">
        <div class="left">
            <p>Articles</p>
        </div>
        <div class="pageName">
            <h3>随笔</h3>
            <i class="ri-arrow-down-circle-line"></i>
        </div>
    </div>
    <script>
        arrow=document.querySelector('.pageName i')
        arrow.addEventListener('click',function(){
            window.scrollTo({
                top:document.querySelector('.headerSeparator').offsetTop,
                behavior:'smooth'
            })
        })

    </script>
    <div class="headerSeparator"></div>
    


    <!-- 内容渲染区域 -->
    <div class="wrapper"></div>




    <script>
        const wrapper=document.querySelector('.wrapper')
        fetch("./posts/posts.json")
        .then(res=>res.json())
        .then(posts=>{
            posts.forEach(post=>{
                const articleCard=document.createElement("div")
                const img=document.createElement("img")
                const text=document.createElement("div")
                const markdownStyle=document.createElement("div")
                const aboveTitle=document.createElement("p")
                const title=document.createElement("h1")
                const info=document.createElement("p")
                const link=document.createElement("a")
                const largeSeparator=document.createElement("div")
                const i=document.createElement("i")

                articleCard.className="articleCard"
                img.className="leftPic"
                img.src=post.img;
                text.className="text"
                markdownStyle.className="markdownStyle"
                aboveTitle.className="aboveTitle"
                aboveTitle.innerHTML=post.enTitle
                title.innerHTML=post.cnTitle
                info.innerHTML=post.info
                link.className="rightArrow"
                link.href=post.link
                largeSeparator.className="largeSeparator"
                i.className="ri-arrow-right-s-line"

                wrapper.appendChild(articleCard)
                articleCard.appendChild(img);
                articleCard.appendChild(text);
                articleCard.appendChild(link);
                text.appendChild(markdownStyle);
                markdownStyle.appendChild(aboveTitle);
                markdownStyle.appendChild(title);
                markdownStyle.appendChild(largeSeparator);
                markdownStyle.appendChild(info);
                link.appendChild(i)

            })
        })
    </script>

















    <!-- 底部版权栏 -->
    <div class="bottom">
        <div class="wrapper">
            <div class="slogan">
                <p>" 永远<span>年轻</span>，永远<span>热爱</span>，永远<span>热泪盈眶</span>&nbsp;&nbsp;"</p>
                <p>With youth, with passion, with tears of devotion.</p>
            </div>
            <div class="logos">
                <a href="https://github.com/RichardYi-SYSU/MyBlog"  class="fab fa-github"></a>
                <a href=""></a>
            </div>
            <div class="copyright">
               <p>Copyright © 2025, Richard-Yi All Rights Reserved</p>
            </div>
        </div>
    </div>
</body>
</html>
